# Catálogo de skills de la comunidad (no propios).
#
# Cada entrada registra CUÁNDO se verificó y A QUÉ COMMIT apunta, para poder
# detectar obsolescencia. `scripts/toolkit.py validate` avisa cuando
# `review-by` ya pasó; `scripts/toolkit.py catalog` genera CATALOG.md.
#
# Campos:
#   id               identificador estable de la entrada
#   repo             owner/name en GitHub
#   kind             plugin-marketplace | skill | collection
#   license          SPDX (o texto si upstream no declara archivo)
#   upstream-commit  commit verificado (corto) · upstream-commit-date: fecha de ese commit
#   upstream-version versión publicada si existe
#   verified         fecha en que se revisó la entrada
#   review-by        fecha límite para re-verificar (verified + 3 meses)
#   vendored         skills copiados a vendor/ (lista vacía = solo enlace)
#   submodule        (opcional) ruta del submódulo git en external/ que sigue al upstream
#   stack            (opcional) stacks de los skills del submódulo (según .gitmodules
#                    toolkit-skills); sin stack = general, se instala siempre
#   recommended      skills/plugins recomendados de ese paquete y por qué
#   install          cómo instalar (por herramienta)
#   notes            advertencias (licencia, dependencias, solapamientos)

entries:
  - id: obra-superpowers
    repo: obra/superpowers
    kind: plugin-marketplace
    license: MIT
    upstream-commit: "22f0b46"
    upstream-commit-date: "2026-11-03"
    upstream-version: "7.0.2"
    verified: "2026-11-07"
    review-by: "2027-02-07"
    vendored: [systematic-debugging, verification-before-completion, test-driven-development]
    recommended:
      - name: systematic-debugging
        why: Debugging por causa raíz en fases; evita parches a ciegas.
      - name: verification-before-completion
        why: Obliga a evidencia (tests/comandos) antes de declarar algo terminado.
      - name: test-driven-development
        why: Ciclo rojo-verde-refactor estricto; complementa skills/test-strategy (qué testear) con el cómo.
      - name: brainstorming + writing-plans + executing-plans
        why: Flujo diseño→plan→ejecución. Dependen entre sí y de hooks del plugin; usar el plugin completo, no copias.
    install:
      claude-code: "/plugin install superpowers@claude-plugins-official"
      claude-code-alt: "/plugin marketplace add obra/superpowers-marketplace && /plugin install superpowers@superpowers-marketplace"
      antigravity: "agy plugin install https://github.com/obra/superpowers"
    notes: >-
      El plugin completo inyecta un hook SessionStart que hace que sus skills se
      auto-disparen; puede solaparse con code-review/test-strategy de este repo.
      Si instalas el plugin, las copias de vendor/ quedan redundantes (en Claude Code
      no colisionan porque las del plugin llevan prefijo superpowers:).

  - id: anthropic-skills
    repo: anthropics/skills
    kind: plugin-marketplace
    license: Apache-2.0 (revisar LICENSE.txt de cada skill)
    upstream-commit: "2c5958e"
    upstream-commit-date: "2026-11-06"
    upstream-version: "n/a"
    verified: "2026-11-07"
    review-by: "2027-02-07"
    vendored: [webapp-testing]
    recommended:
      - name: skill-creator
        why: Crear/mejorar skills de este repo y correr evals de disparo. Grande (~270 KB); usar vía plugin.
      - name: mcp-builder
        why: Guía para construir servidores MCP (TS/Python) con evaluaciones.
      - name: webapp-testing
        why: Probar apps web locales con Playwright (útil para tus proyectos React/SvelteKit).
      - name: frontend-design
        why: Interfaces con criterio visual; evita estética genérica.
    install:
      claude-code: "/plugin marketplace add anthropics/skills && /plugin install example-skills@anthropic-agent-skills"
      claude-ai: "skill-creator y frontend-design ya vienen integrados en claude.ai; el resto se sube como skill."
    notes: >-
      webapp-testing se vendoriza por ser pequeño y útil en agentes sin
      marketplace (Cursor, Antigravity, OpenCode...); el resto, vía plugin.

  - id: trailofbits-skills
    repo: trailofbits/skills
    kind: plugin-marketplace
    license: CC-BY-SA-4.0
    upstream-commit: "e4dd0bb"
    upstream-commit-date: "2026-11-06"
    upstream-version: "n/a"
    verified: "2026-11-07"
    review-by: "2027-02-07"
    vendored: []
    recommended:
      - name: insecure-defaults
        why: Credenciales hardcodeadas, secretos de fallback, defaults débiles. Complementa standalone/ai-first-security-auditor.
      - name: supply-chain-risk-auditor
        why: Riesgo de dependencias npm/PyPI/Go con advisories por versión.
      - name: differential-review
        why: Review de seguridad de un diff con análisis de historial y radio de impacto.
      - name: static-analysis
        why: CodeQL + Semgrep + SARIF.
      - name: sharp-edges
        why: APIs y configuraciones propensas a error (footguns).
    install:
      claude-code: "/plugin marketplace add trailofbits/skills  # luego /plugin menu"
      codex: "codex plugin marketplace add trailofbits/skills"
    notes: >-
      Licencia share-alike (CC-BY-SA-4.0): no se vendoriza para no arrastrar esa
      licencia a adaptaciones dentro de este repo. Solo enlace.

  - id: cloudflare-security-audit
    repo: cloudflare/security-audit-skill
    kind: skill
    license: MIT
    submodule: external/cloudflare-security-audit
    upstream-commit: "c1c8a8c"
    upstream-commit-date: "2026-09-14"
    upstream-version: "n/a"
    verified: "2026-11-07"
    review-by: "2027-02-07"
    vendored: []
    recommended:
      - name: security-audit
        why: >-
          Auditoría de seguridad multi-fase (reconocimiento, hunting, validación por un
          agente distinto al que encontró el hallazgo, reporte findings.json). Por defecto
          solo orienta; el flujo completo se activa al pedir una auditoría explícita.
    install:
      claude-code: "Viene con este repo: git clone --recurse-submodules + ./install.sh"
      any-agent: "npx skills add https://github.com/cloudflare/security-audit-skill --skill security-audit"
    notes: >-
      Integrado como submódulo git (sigue la rama main de Cloudflare); Dependabot abre
      un PR mensual cuando hay cambios. El flujo completo requiere Node.js y un sandbox
      sin red con límites de recursos; sin él, los hallazgos que necesitan ejecutar
      código quedan como needs_validation. Más amplio que standalone/ai-first-security-auditor
      (que se centra en TS/Supabase/Docker y remedia código).

  - id: design-doc-mermaid
    repo: SpillwaveSolutions/design-doc-mermaid
    kind: skill
    license: MIT (declarada en README, sin archivo LICENSE)
    upstream-commit: "c36d835"
    upstream-commit-date: "2026-08-24"
    upstream-version: "n/a"
    verified: "2026-11-07"
    review-by: "2027-02-07"
    vendored: [design-doc-mermaid]
    recommended:
      - name: design-doc-mermaid
        why: Diagramas Mermaid (actividad, secuencia, despliegue, arquitectura) y design docs desde código.
    install:
      any-agent: "Usar la copia de vendor/design-doc-mermaid (incluye guías y scripts)."
    notes: >-
      Reemplaza la copia de claude.ai, que solo tenía el SKILL.md sin references/,
      assets/ ni scripts/. Los scripts requieren Python y mermaid-cli (mmdc). El
      flujo de recuperación de errores menciona MCPs opcionales (perplexity, brave).

  # --- Packs por stack (submódulos; solo para proyectos que usan esa herramienta) ---
  - id: supabase-agent-skills
    repo: supabase/agent-skills
    kind: collection
    license: MIT
    submodule: external/supabase-agent-skills
    stack: supabase
    upstream-commit: "c9be0e9"
    upstream-commit-date: "2026-10-02"
    upstream-version: "0.1.2"
    verified: "2026-11-07"
    review-by: "2027-02-07"
    vendored: []
    recommended:
      - name: supabase
        why: >-
          Cualquier tarea con Supabase: Auth/sesiones/JWT, RLS, migraciones, Edge
          Functions, Realtime, Storage, pg_cron, SSR con supabase-js (React, SvelteKit),
          logs y errores típicos. Clave para el SaaS multi-tenant (RLS por cliente).
      - name: supabase-postgres-best-practices
        why: Rendimiento y buenas prácticas de Postgres en Supabase.
    install:
      this-repo: "./install.sh --project --stack supabase   (o --stack auto en un proyecto con Supabase)"
      any-agent: "npx skills add supabase/agent-skills"
    notes: >-
      Solo para proyectos que usan Supabase. --stack auto lo detecta por
      supabase/config.toml, dependencias @supabase/* en package.json, o supabase en
      requirements.txt/pyproject.toml.

  - id: netlify-context-and-tools
    repo: netlify/context-and-tools
    kind: collection
    license: MIT
    submodule: external/netlify-context-and-tools
    stack: netlify
    upstream-commit: "c7ef213"
    upstream-commit-date: "2026-11-05"
    upstream-version: "n/a"
    verified: "2026-11-07"
    review-by: "2027-02-07"
    vendored: []
    recommended:
      - name: netlify-deploy
        why: Deploys por Git o CLI (preview/producción), variables de entorno.
      - name: netlify-functions
        why: Funciones serverless (TS/JS/Go) para endpoints y backend.
      - name: netlify-config
        why: netlify.toml, _redirects, _headers, comandos de build.
    install:
      this-repo: "./install.sh --project --stack netlify   (o --stack auto en un proyecto con Netlify)"
      claude-code-plugin: "/plugin install netlify-skills@claude-plugins-official  # todos + MCP de Netlify"
    notes: >-
      Solo para proyectos que usan Netlify. Se instalan 3 de 16 skills a propósito:
      se excluye netlify-database (Postgres propio de Netlify) porque compite con
      Supabase y el agente podría sugerirlo en proyectos que ya usan Supabase; el resto
      (blobs, forms, identity, edge functions, AI gateway...) se agrega en .gitmodules
      (toolkit-skills) cuando un proyecto lo necesite. --stack auto detecta netlify.toml,
      .netlify/ o dependencias de Netlify en package.json.

  - id: vercel-agent-skills
    repo: vercel-labs/agent-skills
    kind: collection
    license: MIT (declarada en README, sin archivo LICENSE)
    submodule: external/vercel-agent-skills
    stack: react, vercel
    upstream-commit: "1a2c79d"
    upstream-commit-date: "2026-10-27"
    upstream-version: "n/a"
    verified: "2026-11-07"
    review-by: "2027-02-07"
    vendored: []
    recommended:
      - name: react-best-practices
        why: >-
          Rendimiento en React/Next.js (stack react). Se instala con el nombre
          vercel-react-best-practices, que es el declarado por upstream.
      - name: web-design-guidelines
        why: Auditoría de UI/UX y accesibilidad (stack react).
      - name: deploy-to-vercel
        why: Deploys y previews en Vercel (stack vercel).
    install:
      this-repo: "./install.sh --project --stack react,vercel   (o --stack auto)"
      any-agent: "npx skills add vercel-labs/agent-skills"
    notes: >-
      Dos stacks en un mismo submódulo: react (proyectos React/Next.js, detectado por
      "react" en package.json) y vercel (vercel.json, .vercel/ o dependencia vercel).

  # --- Solo referencia (catálogos para buscar, no se integran) ------------------
  - id: awesome-copilot

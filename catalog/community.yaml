    kind: collection
    license: MIT
    upstream-commit: "797337f"
    upstream-commit-date: "2026-11-07"
    upstream-version: "n/a"
    verified: "2026-11-07"
    review-by: "2027-02-07"
    vendored: []
    recommended:
      - name: (explorar)
        why: >-
          Catálogo comunitario de ~457 skills (más agents, instructions y hooks) que
          Microsoft recomienda como fuente de ejemplos. Calidad muy variable: revisar
